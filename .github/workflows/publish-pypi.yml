name: Publish To PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate tag matches package version
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import tomllib

          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          if ref_type and ref_type != "tag":
              print(f"Skipping tag/version check for non-tag ref type: {ref_type}")
              raise SystemExit(0)

          package = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = package["project"]["version"]
          tag = os.environ.get("GITHUB_REF_NAME", "")
          expected = f"v{package_version}"
          print(f"Tag: {tag} | Package version: {package_version}")
          if tag and tag != expected:
              raise SystemExit(
                  f"Release tag/version mismatch. Expected tag '{expected}', got '{tag}'."
              )
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Twine check
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/bone-microarchitecture

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
